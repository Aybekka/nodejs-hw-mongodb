tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: Sends an email with a password reset link to the given address if a user with that email exists.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: john@example.com
responses:
  '200':
    description: Reset email sent successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
  '404':
    $ref: ../../components/responses/404.yaml
  '500':
    description: Failed to send email
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: Failed to send the email, please try again later.
