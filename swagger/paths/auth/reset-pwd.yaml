tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: Resets the user's password using the JWT token received from the reset email.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            description: JWT token from the reset email link
            example: eyJhbGciOiJIUzI1NiJ9...
          password:
            type: string
            description: New password
            example: newpassword123
responses:
  '200':
    description: Password successfully reset
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
  '401':
    description: Token is expired or invalid
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Token is expired or invalid.
  '404':
    $ref: ../../components/responses/404.yaml
