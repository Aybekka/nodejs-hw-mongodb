tags:
  - Contacts
summary: Get a contact by ID
operationId: getContactById
description: Returns a single contact by its ID. The contact must belong to the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: MongoDB ObjectId of the contact
    example: 65e4decdd286b30065d54af9
responses:
  '200':
    description: Successfully found the contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 65e4decdd286b30065d54af9!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
